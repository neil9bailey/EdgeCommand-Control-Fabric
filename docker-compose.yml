name: edgecommand-control-fabric

services:
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      AUTH_MODE: ${AUTH_MODE:-development}
      API_GATEWAY_PORT: 3101
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_EXPECTED_TENANT_ID: ${ENTRA_EXPECTED_TENANT_ID:-}
      ENTRA_EXPECTED_AUDIENCE: ${ENTRA_EXPECTED_AUDIENCE:-}
      ENTRA_EXPECTED_ISSUER: ${ENTRA_EXPECTED_ISSUER:-}
      ENTRA_EXPECTED_ISSUERS: ${ENTRA_EXPECTED_ISSUERS:-}
      ENTRA_OIDC_DISCOVERY_URL: ${ENTRA_OIDC_DISCOVERY_URL:-}
      ENTRA_JWKS_URI: ${ENTRA_JWKS_URI:-}
      ENTRA_ROLE_CLAIM: ${ENTRA_ROLE_CLAIM:-roles}
      ENTRA_GROUP_TO_ROLE_JSON: ${ENTRA_GROUP_TO_ROLE_JSON:-}
      ENTRA_PRINCIPAL_TO_ROLE_JSON: ${ENTRA_PRINCIPAL_TO_ROLE_JSON:-}
      AZURE_KEY_VAULT_URL: ${AZURE_KEY_VAULT_URL:-}
      AZURE_KEY_VAULT_REQUIRED: ${AZURE_KEY_VAULT_REQUIRED:-false}
      AZURE_KEY_VAULT_OVERWRITE: ${AZURE_KEY_VAULT_OVERWRITE:-false}
      AZURE_KEY_VAULT_SECRET_NAMES_JSON: ${AZURE_KEY_VAULT_SECRET_NAMES_JSON:-}
      AZURE_KEY_VAULT_REQUIRED_SECRET_ENV_NAMES: ${AZURE_KEY_VAULT_REQUIRED_SECRET_ENV_NAMES:-}
      EDGECOMMAND_INTERNAL_API_TOKEN: ${EDGECOMMAND_INTERNAL_API_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      POSTMAN_API_KEY: ${POSTMAN_API_KEY:-}
      HOME_ASSISTANT_TOKEN: ${HOME_ASSISTANT_TOKEN:-}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    ports:
      - "${API_GATEWAY_PORT:-3101}:3101"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3101/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web-console:
    build:
      context: .
      dockerfile: apps/web-console/Dockerfile
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:3101}
    ports:
      - "${WEB_CONSOLE_PORT:-5174}:5174"
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

  mqtt-broker:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    restart: unless-stopped
